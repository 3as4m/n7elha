    <!-- Intro: the drawn logo's wordmark is set in ArslanWessam; preload it so
         it is in by the time the wordmark wipes in (the site uses it anyway). -->

    <style>
      /* Branded first-load intro. Lives in the HTML so it paints before any
         JS: on the page's cream, the logo draws itself (pencil sketch, ink
         flood, the dot drops and bounces, the wordmark wipes in; markup
         rendered from src/components/NefelhaLogoIntro.tsx) with brand drops
         settling in the corners. src/lib/intro.ts then lifts the whole screen
         away, a teal wavy hem sweeping up as it goes. Repeat loads in the
         same tab session, and the student / teacher app, get the quick
         version: the finished logo, lifted almost at once. */
      @font-face { font-family: 'ArslanWessam'; src: url('/fonts/arslan_wessam_b.ttf') format('truetype'); font-display: block; }
      #intro { position: fixed; inset: 0; z-index: 9999; overflow: hidden; }
      #intro .ip { position: absolute; left: 0; right: 0; top: 0; bottom: -150px; display: flex; flex-direction: column;
                   transition: transform .9s cubic-bezier(.77,0,.18,1); }
      #intro .if { position: relative; flex: 1; background: #F3E7C9; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      #intro .iw { display: block; width: 100%; height: 150px; margin-top: -1px; flex-shrink: 0; }
      #intro.out .ip { transform: translateY(calc(-100% - 20px)); }
      #intro .logo { width: min(52vw, 280px); transition: transform .9s cubic-bezier(.77,0,.18,1), opacity .5s; }
      #intro.out .logo { transform: translateY(-50px) scale(.92); opacity: 0; }
      #intro .bd { position: absolute; animation: i-in 1s cubic-bezier(.34,1.56,.64,1) both; }
      #intro .bd.b1 { width: min(30vw, 260px); top: -6%; right: -5%; animation-delay: .2s; }
      #intro .bd.b2 { width: min(16vw, 120px); bottom: 8%; left: 6%; animation-delay: .45s; }
      #intro .bd.b3 { width: min(7vw, 54px); top: 18%; left: 14%; animation-delay: .65s; }
      @keyframes i-in { from { opacity: 0; transform: scale(.3) rotate(-30deg); } to { opacity: 1; transform: none; } }
      #intro.quick .bd, #intro.quick .nl * { animation: none !important; }
      @media (prefers-reduced-motion: reduce) {
        #intro .bd { animation: none; }
        #intro .ip { transition: opacity .4s; }
        #intro.out .ip { transform: none; opacity: 0; }
      }
    </style>
